<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div align="center">
    <h3> company level task page </h3> <hr>
    <table cellpadding="10" border="1" width="50%">
        <tr>
            <td>Task Name </td> 
            <td> <input type="text" name="taskname" placeholder="Enter your task name"> </td>
        </tr>
        <tr>
            <td> Task Description </td>
            <td> <input type="text" name="taskdescription" placeholder="Enter your task description"> </td>
        </tr>
        <tr>
            <td> Task Deadline </td>
            <td> <input type="date" name="taskdeadline" placeholder="Enter your task deadline"> </td>
        </tr>
        <tr>
            <td colspan="2" align="center"> 
                <input type="submit" value="Submit Task">
             </td>
        </tr>
    
</body>
</html>
